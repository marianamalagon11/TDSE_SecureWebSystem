<VirtualHost *:80>
    ServerName enterprise-risk-lab-mariana.duckdns.org
    DocumentRoot /var/www/enterprise-risk-frontend

    RewriteEngine On

    <Directory /var/www/enterprise-risk-frontend>
        Options -Indexes
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8080/api/
    ProxyPassReverse /api/ http://127.0.0.1:8080/api/

    RequestHeader set X-Forwarded-Proto "http"
RewriteCond %{SERVER_NAME} =enterprise-risk-lab-mariana.duckdns.org
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
